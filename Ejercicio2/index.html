<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <title>Tablas de multiplicar y dividir</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="js/tablaMultiplicar.js"></script>
  <script src="js/tablaDividir.js"></script>
</head>
<body>

  <h1>Tabla de multiplicar</h1>
  <form onsubmit="mostrarTabla(event)">
    <label for="numero">Introduce el número:</label>
    <input id="numero" type="number" required />
    <input type="submit" value="Mostrar tabla" />
  </form>
  <div id="tabla"></div>

  <hr />

  <h1>Tabla de dividir</h1>
  <form onsubmit="mostrarTablaDividir(event)">
    <label for="numeroDividir">Introduce el número:</label>
    <input id="numeroDividir" type="number" required />
    <input type="submit" value="Mostrar tabla" />
  </form>
  <div id="tablaDividir"></div>

</body>
</html>
